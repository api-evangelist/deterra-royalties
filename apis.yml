name: Deterra Royalties

description: Deterra Royalties (Deterra Royalties Limited) is an ASX-listed resources company that specialises
  in the acquisition and management of metal royalty and stream interests. It provides royalty financing
  to mine developers and operators, acquires existing third-party royalties, and holds royalties over
  assets such as BHP's Mining Area C, Lithium Americas' Thacker Pass project and Ivanhoe Electric's Santa
  Cruz copper project. Its corporate website publishes investor information and ASX announcements; no
  public developer API, API documentation or developer portal is published.

